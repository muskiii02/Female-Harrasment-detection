{% extends "base.html" %}

{% block title %}Register - Harassment Detection System{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
    }

    .login-card {
        background: rgba(26, 26, 46, 0.7);
        backdrop-filter: blur(15px);
        border-radius: 16px;
        padding: 3rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        max-width: 450px;
        width: 100%;
        border: 1px solid rgba(45, 45, 68, 0.5);
        position: relative;
        overflow: hidden;
    }

    .login-card::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -20%;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, var(--purple-glow) 0%, transparent 70%);
        border-radius: 50%;
    }

    .login-title {
        text-align: center;
        color: var(--text-white);
        margin-bottom: 2rem;
        font-size: 2rem;
        font-weight: 700;
        position: relative;
        z-index: 1;
    }

    .form-group {
        margin-bottom: 1.5rem;
        position: relative;
        z-index: 1;
    }

    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-light);
        font-weight: 500;
    }

    .form-group input {
        width: 100%;
        padding: 0.75rem;
        border: 2px solid rgba(45, 45, 68, 0.5);
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s;
        background: rgba(10, 10, 20, 0.5);
        backdrop-filter: blur(5px);
        color: var(--text-white);
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--primary-purple);
        background: rgba(26, 26, 46, 0.7);
        box-shadow: 0 0 0 3px var(--purple-glow);
    }

    .btn-full {
        width: 100%;
        padding: 1rem;
        font-size: 1.1rem;
        margin-top: 1rem;
    }

    .register-link {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--text-light);
        position: relative;
        z-index: 1;
    }

    .register-link a {
        color: var(--primary-purple);
        text-decoration: none;
        font-weight: 600;
    }

    .register-link a:hover {
        color: var(--secondary-purple);
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 2rem; position: relative; z-index: 1;">
            <div style="width: 80px; height: 80px; background: rgba(147, 51, 234, 0.2); border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; border: 2px solid var(--primary-purple); box-shadow: 0 0 20px var(--purple-glow);">
                📝
            </div>
            <h1 class="login-title">Create Account</h1>
        </div>
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Register</button>
        </form>
        <div class="register-link">
            Already have an account? <a href="{{ url_for('login') }}">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
